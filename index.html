<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resgate VPU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --brown:#3F2F1F;
      --dark:#110D09;
      --filter:#B38C65;
      --shadow:#94704E;
      --cream:#F5F1EB;
      --line:#DED4C8;
    }
    body{background:var(--brown);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shadow-custom{box-shadow:0 8px 22px rgba(148,112,78,.38)}
    .kpi{background:var(--dark)}
    .filter{background:var(--filter)}
    .copyable{cursor:pointer;transition:.15s}
    .copyable:hover{background:#eee7de}
    .toast{transform:translateY(12px);opacity:0;pointer-events:none;transition:.2s}
    .toast.show{transform:translateY(0);opacity:1}
    input[type=file]::file-selector-button{background:var(--dark);color:white;border:0;border-radius:7px;padding:8px 12px;margin-right:10px;cursor:pointer}
  </style>
</head>
<body class="min-h-screen text-[#110D09]">
  <main class="max-w-[1500px] mx-auto p-5 md:p-7">
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
      <div class="text-white">
        <h1 class="text-2xl font-bold">Resgate VPU</h1>
        <p class="text-sm opacity-75">Acompanhamento da régua de prospecções perdidas</p>
      </div>
      <label class="bg-white rounded-xl px-4 py-3 shadow-custom cursor-pointer text-sm font-semibold">
        <span>Importar CSV</span>
        <input id="csvFile" type="file" accept=".csv,text/csv" class="hidden">
      </label>
    </header>

    <section class="filter rounded-2xl p-4 mb-5 shadow-custom">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
        <div>
          <label class="block text-xs font-bold mb-1">Data em que foi marcado "Perdemos"</label>
          <input id="baseDate" type="date" class="w-full rounded-lg border-0 px-3 py-2 bg-white outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">Canal</label>
          <select id="channelFilter" class="w-full rounded-lg border-0 px-3 py-2 bg-white outline-none"><option value="">Todos</option></select>
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">Campanha</label>
          <select id="campaignFilter" class="w-full rounded-lg border-0 px-3 py-2 bg-white outline-none"><option value="">Todas</option></select>
        </div>
        <button id="clearBtn" class="rounded-lg bg-[#110D09] text-white px-4 py-2 font-semibold hover:opacity-90">Limpar</button>
      </div>
    </section>

    <section id="kpis" class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-5"></section>

    <section class="bg-[#F5F1EB] rounded-2xl shadow-custom overflow-hidden">
      <div class="p-4 border-b border-[#DED4C8] flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
        <div>
          <h2 class="font-bold text-lg">Clientes para trabalhar</h2>
          <p id="summary" class="text-sm opacity-65">Importe um CSV para começar.</p>
        </div>
        <input id="search" type="search" placeholder="Buscar nome, contato ou ID..." class="w-full md:w-80 rounded-lg border border-[#DED4C8] px-3 py-2 outline-none">
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-[#E7DED3]">
            <tr>
              <th class="text-left px-4 py-3">Copiar</th>
              <th class="text-left px-4 py-3">Nome</th>
              <th class="text-left px-4 py-3">Canal</th>
              <th class="text-left px-4 py-3">Campanha</th>
              <th class="text-left px-4 py-3">Contato</th>
              <th class="text-left px-4 py-3">Endereço</th>
              <th class="text-left px-4 py-3">Régua</th>
              <th class="text-left px-4 py-3">Data</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="empty" class="hidden p-10 text-center opacity-60">Nenhum cliente encontrado.</div>
    </section>
  </main>

  <div id="toast" class="toast fixed bottom-5 right-5 bg-[#110D09] text-white px-4 py-3 rounded-xl shadow-custom text-sm font-semibold">
    Copiado!
  </div>

<script>
const offsets = [3,7,30,90,360];
let rows = [];
const $ = id => document.getElementById(id);

function parseCSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(x=>x.trim());
  if(!lines.length) return [];
  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ';' : ',';
  const parseLine = line => {
    const out=[]; let cur='', quoted=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c === '"'){
        if(quoted && line[i+1] === '"'){cur+='"';i++} else quoted=!quoted;
      } else if(c===sep && !quoted){out.push(cur.trim());cur='';}
      else cur+=c;
    }
    out.push(cur.trim()); return out;
  };
  const headers=parseLine(lines[0]).map(h=>h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'_'));
  return lines.slice(1).map(line=>{
    const vals=parseLine(line), obj={};
    headers.forEach((h,i)=>obj[h]=vals[i]??'');
    return obj;
  });
}

function dateFromInput(v){
  if(!v) return null;
  const [y,m,d]=v.split('-').map(Number);
  return new Date(y,m-1,d);
}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d}
function fmt(d){return d.toLocaleDateString('pt-BR')}
function isoToday(){return new Date().toISOString().slice(0,10)}

function getBaseDate(){
  return dateFromInput($('baseDate').value) || new Date();
}
function dueInfo(base){
  const today=new Date(); today.setHours(0,0,0,0);
  let current=null, next=null;
  offsets.forEach(n=>{
    const d=addDays(base,n);
    if(d<=today) current=n;
    if(!next && d>today) next=n;
  });
  return {current,next};
}
function rebuildFilters(){
  const ch=[...new Set(rows.map(r=>r.canal_de_venda||r.canal||'').filter(Boolean))].sort();
  const ca=[...new Set(rows.map(r=>r.campanha||'').filter(Boolean))].sort();
  $('channelFilter').innerHTML='<option value="">Todos</option>'+ch.map(x=>`<option>${esc(x)}</option>`).join('');
  $('campaignFilter').innerHTML='<option value="">Todas</option>'+ca.map(x=>`<option>${esc(x)}</option>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function filtered(){
  const ch=$('channelFilter').value, ca=$('campaignFilter').value, q=$('search').value.toLowerCase();
  return rows.filter(r=>{
    const channel=r.canal_de_venda||r.canal||'';
    const campaign=r.campanha||'';
    const hay=[r.id,r.nome,r.contato].join(' ').toLowerCase();
    return (!ch||channel===ch)&&(!ca||campaign===ca)&&(!q||hay.includes(q));
  });
}
function renderKPIs(){
  const base=getBaseDate();
  $('kpis').innerHTML=offsets.map(n=>{
    const target=addDays(base,n), today=new Date(); today.setHours(0,0,0,0);
    const count=filtered().filter(()=>target.getTime()===today.getTime()).length;
    const past=target<today;
    return `<button class="kpi text-white rounded-2xl p-4 text-left shadow-custom ${past?'opacity-75':''}" onclick="setOffset(${n})">
      <div class="text-xs opacity-60">D+${n}</div>
      <div class="text-2xl font-bold mt-1">${count}</div>
      <div class="text-xs opacity-55 mt-1">${fmt(target)}</div>
    </button>`;
  }).join('');
}
function render(){
  renderKPIs();
  const base=getBaseDate(), list=filtered();
  const today=new Date(); today.setHours(0,0,0,0);
  const due=list.filter(r=>offsets.some(n=>addDays(base,n).getTime()===today.getTime()));
  $('summary').textContent=`${due.length} cliente(s) com contato previsto para hoje · ${list.length} na base filtrada`;
  const body=$('tableBody'); body.innerHTML='';
  $('empty').classList.toggle('hidden',due.length>0);
  due.forEach(r=>{
    const info=dueInfo(base), channel=r.canal_de_venda||r.canal||'';
    const target=offsets.find(n=>addDays(base,n).getTime()===today.getTime());
    const tr=document.createElement('tr'); tr.className='border-b border-[#DED4C8] hover:bg-[#eee7de]';
    tr.innerHTML=`
      <td class="px-4 py-3"><button class="copyable bg-[#E7DED3] rounded-md px-3 py-2" title="Copiar nome e telefone" data-copy="${esc((r.nome||'')+'\\n'+(r.contato||''))}">📋</button></td>
      <td class="px-4 py-3 font-semibold copyable" data-copy="${esc(r.nome||'')}" title="Clique para copiar">${esc(r.nome||'-')}</td>
      <td class="px-4 py-3">${esc(channel||'-')}</td>
      <td class="px-4 py-3">${esc(r.campanha||'-')}</td>
      <td class="px-4 py-3 copyable" data-copy="${esc(r.contato||'')}" title="Clique para copiar">${esc(r.contato||'-')}</td>
      <td class="px-4 py-3">${esc(r.endereco||'-')}</td>
      <td class="px-4 py-3 font-bold">D+${target}</td>
      <td class="px-4 py-3">${fmt(target?addDays(base,target):base)}</td>`;
    body.appendChild(tr);
  });
}
function setOffset(n){
  const base=getBaseDate();
  const d=addDays(base,n);
  const [y,m,day]=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')];
  $('search').value='';
  render();
}
function toast(){
  $('toast').classList.add('show');
  clearTimeout(window.tt); window.tt=setTimeout(()=>$('toast').classList.remove('show'),1200);
}

$('csvFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{rows=parseCSV(ev.target.result); rebuildFilters(); render();};
  reader.readAsText(file,'UTF-8');
});
$('baseDate').value=isoToday();
['baseDate','channelFilter','campaignFilter','search'].forEach(id=>$(id).addEventListener('input',render));
$('clearBtn').addEventListener('click',()=>{rows=[];$('csvFile').value='';rebuildFilters();render()});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-copy]'); if(!el)return;
  navigator.clipboard.writeText(el.dataset.copy).then(toast);
});
render();
</script>
</body>
</html>
